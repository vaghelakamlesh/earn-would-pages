<!doctype html><html lang="en"><head><title>Reset password - Earn Would</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:24px;color:#1b2430}h1{font-size:26px}h2{font-size:18px;margin-top:28px}input,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #bcc6d0;width:100%;margin:6px 0}button{background:#f4b740;border:0;font-weight:700}</style></head><body>
<h1>Set a new password</h1>
<p id="msg">Open this page from the link in your reset email.</p>
<div id="box" hidden>
  <input id="pw" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password">
  <button id="go">Save password</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Same two values as web/config.js
  const sb = supabase.createClient("https://YOUR-PROJECT-REF.supabase.co", "YOUR-ANON-PUBLIC-KEY");
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") { document.getElementById("box").hidden = false; document.getElementById("msg").textContent = "Choose a new password."; }
  });
  document.getElementById("go").onclick = async () => {
    const pw = document.getElementById("pw").value;
    if (pw.length < 8) return alert("Use at least 8 characters.");
    const { error } = await sb.auth.updateUser({ password: pw });
    document.getElementById("msg").textContent = error ? "Could not save: " + error.message : "Password updated. Go back to the app and log in.";
    if (!error) document.getElementById("box").hidden = true;
  };
</script>
</body></html>
